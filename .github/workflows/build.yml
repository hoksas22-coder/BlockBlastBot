name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "BlockBlastBot-AndroidIDE.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract project
        run: |
          unzip -q BlockBlastBot-AndroidIDE.zip
          cd BlockBlastBot
          echo "Project extracted"
          ls -la

      - name: Build APK
        working-directory: BlockBlastBot
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockBlastBot-debug
          path: BlockBlastBot/app/build/outputs/apk/debug/app-debug.apk
